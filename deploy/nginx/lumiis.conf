server {
    listen 80;
    listen [::]:80;
    server_name alpha.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alpha.example.com;

    root /var/www/lumiis/public;
    index index.php;
    charset utf-8;

    client_max_body_size 16m;

    access_log /var/log/nginx/lumiis.access.log;
    error_log /var/log/nginx/lumiis.error.log warn;

    ssl_certificate /etc/letsencrypt/live/alpha.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|gif|ico|jpeg|jpg|js|png|svg|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
