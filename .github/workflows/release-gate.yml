name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite, dom
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build SPA
        run: bash scripts/build-frontend.sh

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          {
            echo "APP_URL=http://127.0.0.1:8000"
            echo "FRONTEND_URL=http://127.0.0.1:8000/play"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
          } >> .env
          php artisan key:generate --ansi
          php artisan migrate --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gate
        run: bash scripts/release-gate.sh

      - name: Upload UI proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-proof-screenshots
          path: |
            screenshots/ui-proof-*
            screenshots/spa-smoke-*
          if-no-files-found: warn
